aid: easywebinar
name: EasyWebinar
description: >-
  EasyWebinar is a live and automated webinar platform for course creators, marketers,
  coaches and enterprise teams, combining live webinars, automated/simulive and evergreen
  webinars, an AI webinar funnel builder, EasyCast multistreaming to YouTube, LinkedIn,
  Facebook and custom RTMP destinations, built-in checkout for paid webinars, and Easy Suite
  — a native CRM with lead scoring, email sequences and automated follow-up. The platform
  scales to 100,000 live attendees on Dolby OptiView (Millicast) WebRTC infrastructure and
  is SOC 2 Type II certified (audited by Scrut Automation) with GDPR controls, SAML 2.0 SSO
  and SCIM provisioning on the Enterprise tier. EasyWebinar publicly serves an OAuth 2.0 /
  OpenID Connect authorization server at app.easywebinar.com and markets a REST API and
  webhooks covering registration, attendance, lead data, CRM sync and event lifecycle
  events — but that API is a Scale-plan and Enterprise entitlement, and no public reference,
  OpenAPI or webhook catalogue is published.
