apis:
- name: EasyWebinar OAuth 2.0 / OpenID Connect
  description: >-
    The only anonymously reachable, machine-readable EasyWebinar API surface. The
    application host publishes a complete OpenID Connect discovery document and RFC 8414
    authorization-server metadata, with live authorize, token, userinfo, introspection and
    revocation endpoints. Scopes advertised are openid, profile, email and basic. Dynamic
    client registration is disabled, so clients are provisioned out of band.
  humanURL: https://easywebinar.com/enterprise/
  baseURL: https://app.easywebinar.com
