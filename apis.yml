x-api-access-gate: >-
  EasyWebinar markets a REST API and webhooks (registration, attendance, lead data, CRM
  sync, event lifecycle) on https://easywebinar.com/enterprise/, but API access is a paid
  entitlement that first appears on the Scale plan ($349/mo) and Enterprise, and sandbox
  access is Enterprise-only. No public API reference, OpenAPI, webhook catalogue or
  developer portal exists — 33 anonymous probes across easywebinar.com,
  app.easywebinar.com and support.easywebinar.com returned no specification. The OAuth 2.0
  / OpenID Connect authorization server at app.easywebinar.com is the only machine-readable
  contract the company publishes anonymously.
